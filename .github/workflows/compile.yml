name: PS3 Build & Push

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make texinfo libncurses5-dev patch python3 python3-dev bzip2 libgmp3-dev pkg-config g++ libssl-dev clang wget git zlib1g-dev libtool libtool-bin

      - name: Restore PS3DEV Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-ubuntu-latest

      - name: Setup PS3DEV Environment (If Not Cached)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /usr/local/ps3dev/bin /usr/local/ps3dev/ppu/bin /usr/local/ps3dev/spu/bin
          sudo chown -R $USER:$USER /usr/local/ps3dev
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=/usr/local/ps3dev
          export PATH="/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin:$PATH"
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh

      - name: Save PS3DEV Cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-ubuntu-latest

      - name: Setup Environment Paths
        run: |
          echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=/usr/local/ps3dev" >> $GITHUB_ENV
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Patch Makefile (Otomatik Düzeltme)
        run: |
          sed -i 's/ps3std.mk/ppu_rules/g' Makefile || echo "Makefile bulunamadı veya değiştirilemedi"

      - name: Compile Game
        run: make

      - name: Commit and Push Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add EBOOT.BIN PARAM.SFO || echo "Dosyalar henüz oluşmadı"
          git commit -m "Auto-update compiled EBOOT.BIN and PARAM.SFO" || echo "No changes to commit"
          git push
          
